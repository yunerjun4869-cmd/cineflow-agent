# Model registry: every model the backend can call is declared here.
#
# Fields
#   name          display name
#   provider      api_providers.<id> in config.yaml that serves this model
#                 (dashscope / ark / kling / openai / gemini / deepseek / openai_compatible)
#   family        optional model family used by provider adapters (qwen, wan, seedream, ...)
#   type          capability types: llm, vlm, t2i, i2i, video
#   concurrency   max parallel requests when concurrency is enabled
#   capabilities  optional media capability metadata (resolutions, ratios, durations, ...)
#
# Add or override models without editing this file:
#   - backend/registry/models.local.yaml (same format, git-ignored), or
#   - config.yaml -> custom_models: {<model-id>: {...}}
